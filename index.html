<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Cobranzas y Préstamos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Control de Cobranzas</h1>

  <!-- FORMULARIO NUEVO PRESTAMO -->
  <div class="card">
    <h2>Nuevo Perfil / Préstamo</h2>
    <form id="loanForm">
      <div class="form-group">
        <label>Nombre del Cliente</label>
        <input type="text" id="clientName" placeholder="Ej: Juan Pérez" required>
      </div>
      <div class="form-group">
        <label>Monto Prestado ($)</label>
        <input type="number" id="amount" placeholder="100000" required>
      </div>
      <div class="form-group">
        <label>Porcentaje Interés (%)</label>
        <input type="number" id="interest" placeholder="20" required>
      </div>
      <div class="form-group">
        <label>Cantidad de Cuotas</label>
        <input type="number" id="installments" placeholder="4" required>
      </div>
      <div class="form-group">
        <label>Frecuencia de Pago</label>
        <select id="frequency">
          <option value="Semanal">Semanal</option>
          <option value="Quincenal">Quincenal</option>
          <option value="Mensual">Mensual</option>
        </select>
      </div>
      <button type="submit">Guardar Préstamo</button>
    </form>
  </div>

  <!-- LISTA DE PERFILES Y COBROS -->
  <h2>Perfiles Activos</h2>
  <div id="clientList">Cargando perfiles...</div>

  <!-- LÓGICA DE JAVASCRIPT -->
  <script type="module" src="script.js"></script>
</body>
</html>
